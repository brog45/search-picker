<doctype !html>
<html>
<head>
<title>Search</title>
</head>
<body>
<h1>Search</h1>
<code id="search-term"></code>
<ul>
<li><a class="search" href="https://en.wikipedia.org/wiki/Special:Search?search=xyzzy&go=Go&ns0=1">Wikipedia</a></li>
<li><a class="search" href="https://www.imdb.com/find/?q=xyzzy">IMDB</a></li>
<li><a class="search" href="https://noai.duckduckgo.com/?q=%s&noai=1">Duck Duck Go (without AI)</a></li>
<li><a class="search" href="https://www.duckduckgo.com/?q=%s">Duck Duck Go</a></li>
<li><a class="search" href="https://www.google.com/search?q=xyzzy&newwindow=1">Google</a></li>
</ul>
<script>
(function(){
    var hash = decodeURI(document.location.hash.replace(/^#/, ""));
    var searchTerm = document.getElementById("search-term");
    if (searchTerm) {
        searchTerm.innerText = hash;
    }
    document.querySelectorAll("a.search").forEach(e => {
        var href = e.getAttribute("href");
        href = href.replace("xyzzy", encodeURI(hash));
    	e.setAttribute("href", href);
    });
})();
</script>
</body>
</html>
