<!DOCTYPE HTML>
<html>
<head>
    <title>Search</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
</head>
<body>
    <h1>Search</h1>
    <code id="search-term"></code>
    <ul>
        <li><a class="search" data-template="https://en.wikipedia.org/wiki/Special:Search?search=xyzzy&go=Go&ns0=1">Wikipedia</a></li>
        <li><a class="search" data-template="https://www.imdb.com/find/?q=xyzzy">IMDB</a></li>
        <li><a class="search" data-template="https://www.merriam-webster.com/dictionary/xyzzy">Merriam-Webster Dictionary</a></li>
        <li><a class="search" data-template="https://ahdictionary.com/word/search.html?q=xyzzy">American Heritage Dictionary</a></li>        
        <li><a class="search" data-template="https://developer.mozilla.org/en-US/search?q=xyzzy">Mozilla Developer Network</a></li>
        <li><a class="search" data-template="https://noai.duckduckgo.com/?q=xyzzy&noai=1">Duck Duck Go (without AI)</a></li>
        <li><a class="search" data-template="https://www.duckduckgo.com/?q=xyzzy">Duck Duck Go</a></li>
        <li><a class="search" data-template="https://www.google.com/search?q=xyzzy&newwindow=1">Google</a></li>
    </ul>
    <script>
        (function () {
            "use strict";
            function populate() {
                var hash = decodeURI(document.location.hash.replace(/^#/, ""));
                var searchTerm = document.getElementById("search-term");
                if (searchTerm) {
                    searchTerm.innerText = hash;
                }
                document.querySelectorAll("a.search").forEach(e => {
                    var template = e.dataset.template;
                    var href = template.replace("xyzzy", encodeURI(hash));
                    e.setAttribute("href", href);
                });
            }
            window.onhashchange = populate;
            populate();
        })();
    </script>
</body>

</html>
