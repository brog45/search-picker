<!DOCTYPE HTML>
<html>
<head>
    <title>Search</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <style>
        @media (prefers-color-scheme: dark) {
            html {
                filter: invert(90%) brightness(75%);
            }
        }
        ul {
            padding: 0;
        }
        li {
            list-style: none;
        }
        li + li {
            margin-top: 1ex;
        }
        button, input {
            width: 100%;
            padding: 1ex;
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1>Search</h1>
    <input id="search-term" type="search">
    <ul>
        <li><button class="search" data-template="https://en.wikipedia.org/wiki/Special:Search?search=xyzzy&go=Go&ns0=1">Wikipedia</button></li>
        <li><button class="search" data-template="https://www.imdb.com/find/?q=xyzzy">IMDB</button></li>
        <li><button class="search" data-template="https://www.merriam-webster.com/dictionary/xyzzy">Merriam-Webster Dictionary</button></li>
        <li><button class="search" data-template="https://ahdictionary.com/word/search.html?q=xyzzy">American Heritage Dictionary</button></li>
        <li><button class="search" data-template="https://github.com/search?q=xyzzy&type=repositories">GitHub (repositories)</button></li>
        <li><button class="search" data-template="https://developer.mozilla.org/en-US/search?q=xyzzy">Mozilla Developer Network</button></li>
        <li><button class="search" data-template="https://noai.duckduckgo.com/?q=xyzzy&noai=1">Duck Duck Go (without AI)</button></li>
        <li><button class="search" data-template="https://www.duckduckgo.com/?q=xyzzy">Duck Duck Go</button></li>
        <li><button class="search" data-template="https://www.google.com/search?q=xyzzy&newwindow=1">Google</button></li>
    </ul>
    <script>
        (function () {
            "use strict";
            const searchTerm = document.getElementById("search-term");
            function buttonClick(event) {
                const template = event.target.dataset.template;
                const encoded = encodeURIComponent(searchTerm.value);
                const href = template.replace("xyzzy", encoded);
                document.location = href;
            }
            function populate() {
                let searchValue = decodeURIComponent(document.location.hash.replace(/^#/, ""));
                searchTerm.value = searchValue;
                searchTerm.focus();
            }
            window.onhashchange = populate;
            populate();
            document.querySelectorAll("button.search").forEach(e => {
                e.addEventListener("click", buttonClick);
            });
        })();
    </script>
</body>

</html>
